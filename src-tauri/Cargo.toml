[package]
name = "ai-pet"
version = "1.0.0"
description = "A tiny, lightweight AI desktop pet"
authors = ["asifuddin01"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "ai_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# Default TLS = the OS stack (Security.framework on macOS): no bundled crypto, smaller binary.
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "json", "stream", "http2"] }
tokio = { version = "1", features = ["time", "sync", "process", "io-util", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSString", "NSGeometry", "NSObject", "NSDictionary", "NSError", "NSLocale", "NSURL", "NSValue"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem", "NSWindow", "NSResponder", "NSScreen", "NSRunningApplication", "NSWorkspace", "NSGraphics", "objc2-core-foundation", "libc"] }
# Voice input: microphone permission, Apple speech recognition, recording for Whisper.
block2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "block2", "AVAudioBuffer", "AVAudioEngine", "AVAudioFormat", "AVAudioIONode", "AVAudioNode", "AVAudioRecorder", "AVAudioSettings", "AVAudioTime", "AVAudioTypes"] }
objc2-speech = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-avf-audio", "SFSpeechRecognitionRequest", "SFSpeechRecognitionResult", "SFSpeechRecognitionTask", "SFSpeechRecognizer", "SFTranscription"] }
core-foundation = "0.10"
security-framework = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
